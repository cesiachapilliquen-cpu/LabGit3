<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contacto - Agencia de Viajes</title>
</head>
<body style="font-family: Arial, sans-serif; margin: 0; padding: 20px; background-color: #f4f4f9; color: #333;">

    <header style="background-color: #0056b3; padding: 15px; border-radius: 5px;">
        <nav style="text-align: center;">
            <a href="index.html" style="color: white; margin: 0 15px; text-decoration: none; font-weight: bold;">Inicio</a> |
            <a href="about.html" style="color: white; margin: 0 15px; text-decoration: none; font-weight: bold;">Nosotros</a> |
            <a href="contact.html" style="color: white; margin: 0 15px; text-decoration: none; font-weight: bold;">Contacto</a>
        </nav>
    </header>

    <main style="max-width: 800px; margin: 30px auto; background: white; padding: 20px; border-radius: 8px; box-shadow: 0 0 10px rgba(0,0,0,0.1);">
        <h1>Contáctanos</h1>
        <p>Si tienes preguntas o deseas solicitar una cotización, llena el formulario o comunícate con nosotros.</p>
        <form style="display: flex; flex-direction: column; gap: 10px; max-width: 400px;">
            <label for="nombre">Nombre:</label>
            <input type="text" id="nombre" name="nombre" style="padding: 8px; border: 1px solid #ccc; border-radius: 4px;">
            
            <label for="mensaje">Mensaje:</label>
            <textarea id="mensaje" name="mensaje" rows="4" style="padding: 8px; border: 1px solid #ccc; border-radius: 4px;"></textarea>
            
            <button type="button" style="background-color: #0056b3; color: white; padding: 10px; border: none; border-radius: 4px; cursor: pointer;">Enviar</button>
        </form>
    </main>

</body>
</html>
